<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 74" width="248" height="74" role="img" aria-label="CEIAS — Central European Institute of Asian Studies">
  <defs>
    <clipPath id="ceias-lower">
      <path d="M6 38 A30 30 0 0 0 66 38 Z"/>
    </clipPath>
  </defs>
  <!-- Upper half-disc, solid. -->
  <path d="M6 34 A30 30 0 0 1 66 34 Z" fill="#000"/>
