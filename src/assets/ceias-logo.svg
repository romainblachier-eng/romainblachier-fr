    <rect x="0" y="38" width="72" height="5"/>
    <rect x="0" y="46" width="72" height="5"/>
    <rect x="0" y="54" width="72" height="5"/>
    <rect x="0" y="62" width="72" height="5"/>
  </g>
  <text x="88" y="52" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif" font-weight="700"
        font-size="40" fill="#111" textLength="152" lengthAdjust="spacingAndGlyphs">CEIAS</text>
</svg>
