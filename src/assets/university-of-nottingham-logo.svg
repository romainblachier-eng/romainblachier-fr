<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The University of Nottingham">
  <rect width="1280" height="420" fill="#ffffff"/>

  <!-- Castle silhouette (outline + cutouts) -->
  <g fill="#000000" fill-rule="evenodd">
    <path d="
      M 100 310
      L 100 130
      L 115 130 L 115 110 L 135 110 L 135 130 L 150 130
      L 150 95 L 165 95 L 165 75 L 175 75 L 175 65 L 215 65 L 215 75 L 225 75 L 225 95 L 240 95
      L 240 130 L 255 130 L 255 110 L 275 110 L 275 130 L 290 130
      L 290 310
      Z

      M 175 80 L 215 80 L 215 90 L 200 90 L 200 105 L 190 105 L 190 90 L 175 90 Z

      M 180 130 L 210 130 L 210 165 L 180 165 Z

      M 173 195 L 217 195 L 217 230 L 195 245 L 173 230 Z

      M 178 250 L 212 250 L 212 310 L 178 310 Z

      M 118 150 L 148 150 L 148 200 L 118 200 Z

      M 242 150 L 272 150 L 272 200 L 242 200 Z

      M 110 220 L 150 220 L 150 310 L 110 310 Z

      M 240 220 L 280 220 L 280 310 L 240 310 Z
    "/>
  </g>

  <!-- Two stylised wave lines under the castle -->
  <g fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round">
    <path d="M 80 333 C 110 320, 145 320, 175 333 S 235 346, 265 333 S 305 320, 315 330"/>
    <path d="M 80 355 C 110 342, 145 342, 175 355 S 235 368, 265 355 S 305 342, 315 352"/>
  </g>

  <!-- Vertical divider bar -->
  <rect x="360" y="65" width="7" height="290" fill="#000000"/>

  <!-- "The University of" -->
  <text x="400" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#000000" letter-spacing="-1">The University of</text>

  <!-- "Nottingham" -->
  <text x="400" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="130" font-weight="800" fill="#000000" letter-spacing="-2">Nottingham</text>
</svg>
