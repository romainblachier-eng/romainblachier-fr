<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="自由時報 Liberty Times (LTN)">
  <defs>
    <linearGradient id="ltnRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2231a"/>
      <stop offset="1" stop-color="#c40f0a"/>
    </linearGradient>
    <style>
      .ltn { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; font-weight: 800; }
      .han { font-family: "PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans GB",sans-serif; font-weight: 700; }
    </style>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="16" fill="url(#ltnRed)"/>
  <text x="48" y="52" class="ltn" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="-1">LTN</text>
  <text x="48" y="80" class="han" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="1">自由時報</text>
</svg>
